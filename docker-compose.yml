services:
  calle-muerta:
    build: .
    image: calle-muerta:latest
    container_name: calle-muerta
    ports:
      - "${PORT:-8123}:8123"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8123/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
