services:
  calle-muerta:
    build: .
    image: calle-muerta:latest
    container_name: calle-muerta
    ports:
      - "${PORT:-8123}:8123"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
